[project]
name = "lightray"
dynamic = ["version"]
description = "Distribute a LightningCLI hyperparameter search with Ray Tune"
authors = [{ name = "Ethan Jacob Marx", email = "ethan.marx@ligo.org" }]
maintainers = [{ name = "Will Benoit", email = "william.benoit@ligo.org" }]
requires-python = ">=3.11,<3.15"
readme = "README.md"
license = "MIT"
dependencies = [
    "ray[default, tune]>=2.41,<3",
    "lightning>=2.4.0",
    "s3fs>=2024.9.0",
    "pyarrow>=17",
    "jsonargparse[signatures]>=4.50,<5",
    "omegaconf>=2.3.0,<3",
    "botocore",
]

[project.urls]
Repository = "https://github.com/ML4GW/lightray"

[project.scripts]
lightray = "lightray.cli:cli"

[dependency-groups]
dev = [
    "pre-commit>=3.8.0,<4",
    "pytest>=8.3.2,<9",
]

[tool.setuptools-git-versioning]
enabled = true
dev_template = "{tag}.post{ccount}+git.{sha}"

[build-system]
requires = [ "setuptools>=77.0.3", "wheel", "setuptools-git-versioning>=2.0,<4",]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 79
extend-exclude = ["docs"]


[tool.ruff.lint]
mccabe = {"max-complexity" = 18}
select = ["B", "C", "E", "F", "W", "B9", "T201"]
ignore = ["W605", "E203"]  # ignore for consistency with black

# ignore asterisk imports and unused
# import errors in __init__ files
per-file-ignores =  {"**/__init__.py" = ["F401", "F403"]}
